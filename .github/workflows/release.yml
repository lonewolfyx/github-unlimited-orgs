name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          tag="$(git describe --tags --abbrev=0)"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi

          if [[ "$tag" != "$GITHUB_REF_NAME" ]]; then
            echo "Latest tag $tag does not match release ref $GITHUB_REF_NAME"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          release_commit="$(git rev-list -n 1 "$tag")"

          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Tag $tag does not point to a commit contained in main"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          (
            cd packages/chrome-extension/dist
            zip -r "$GITHUB_WORKSPACE/release/github-unlimited-orgs-chrome.zip" .
          )

          cp packages/tampermonkey/dist/github-unlimited-orgs.user.js release/github-unlimited-orgs.user.js

          (
            cd release
            sha256sum github-unlimited-orgs-chrome.zip github-unlimited-orgs.user.js > SHA256SUMS
          )

      - name: Generate GitHub Changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          npx genereleaselog@latest \
            --output=false \
            --assets 'release/github-unlimited-orgs-chrome.zip,release/github-unlimited-orgs.user.js,release/SHA256SUMS'
