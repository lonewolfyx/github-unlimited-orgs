<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>GitHub Unlimited Orgs 设置</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: "SF Pro Text", "PingFang SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 560px;
      margin: 48px auto;
      padding: 0 20px;
      color: #1f2328;
      background: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      body { color: #e6edf3; background: #0d1117; }
      .card { border-color: #30363d !important; }
      .hint, .desc { color: #8b949e !important; }
      .status-on { color: #3fb950 !important; }
      .status-off { color: #d29922 !important; }
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
    .hint { font-size: 13px; color: #59636e; margin: 0 0 24px; }
    .card {
      border: 1px solid #d1d9de;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .title { font-size: 14px; font-weight: 600; margin: 0 0 6px; }
    .desc { font-size: 13px; color: #59636e; margin: 0; line-height: 1.6; }
    .status { font-size: 13px; font-weight: 600; white-space: nowrap; }
    .status-on { color: #1a7f37; }
    .status-off { color: #9a6700; }
    .status-unknown { color: #59636e; }
    button {
      margin-top: 16px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 6px;
      border: 1px solid #d1d9de;
      background: #f6f8fa;
      color: inherit;
      cursor: pointer;
    }
    button:hover { background: #eef1f4; }
    @media (prefers-color-scheme: dark) {
      button { background: #21262d; border-color: #30363d; }
      button:hover { background: #30363d; }
    }
  </style>
</head>
<body>
  <h1>GitHub Unlimited Orgs 设置</h1>
  <p class="hint">在 GitHub 用户主页左侧 Organizations 区块自动展开全部组织，悬停显示原生卡片。</p>

  <div class="card">
    <div class="row">
      <div>
        <p class="title">在无痕模式下启用</p>
        <p class="desc">无痕窗口中的 GitHub 页面默认不运行扩展。开启后，无痕浏览时组织展开功能同样生效。此开关由 Chrome 管理，需跳转到扩展详情页手动勾选。</p>
      </div>
      <span id="incognito-status" class="status status-unknown">检测中…</span>
    </div>
    <button id="open-details" type="button">打开扩展详情页</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
